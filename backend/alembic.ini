# Generic single-database configuration.

[alembic]
# Migration script location.
script_location = alembic

# Template for generated migration file names.
# file_template = %%(rev)s_%%(slug)s
file_template = %%(slug)s

# Timezone used for rendered dates in migration files and names.
# The value is passed to dateutil.tz.gettz(); leave empty for local time.
# timezone =

# Maximum length applied to the slug field.
#truncate_slug_length = 40

# Run the environment during revision commands when set to true.
# revision_environment = false

# Recognize .pyc and .pyo files without source in version directories.
# sourceless = false

# Optional migration version locations. The default is alembic/versions.
# With multiple directories, initial revisions require --version-path.
# version_locations = %(here)s/bar %(here)s/bat alembic/versions

# Output encoding for migration files generated from script.py.mako.
# output_encoding = utf-8

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
